name: Ruff Reviewdog

on:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install ruff reviewdog

      - run: |
          ruff check . --output-format=github > ruff.out || true

      - env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reviewdog \
            -f=github-check \
            -name="ruff" \
            -reporter=github-pr-review \
            -level=warning < ruff.out
