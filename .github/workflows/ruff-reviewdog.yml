name: Ruff Reviewdog

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1

      - name: Run Ruff + Reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ruff check . --output-format=rdjson --exit-zero | reviewdog -f=rdjson \
            -name="ruff" \
            -reporter=github-pr-review \
            -filter-mode=file \
            -level=warning

